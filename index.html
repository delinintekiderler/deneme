<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Beni Seviyor Musun?</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh; /* iPhone Safari adres çubuğu sorunu için */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffe6eb;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Kolaj: bilgisayarda 3x2 */
        .kolaj {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 4px;
            background: #ffe6eb;
            z-index: -1;
        }

        .kolaj img {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            object-fit: cover;        /* kutuyu doldur, bozulma yok */
            object-position: center;
            display: block;
        }

        /* Yatay çekilen 4. foto için istersen odak noktasını buradan değiştir */
        .kolaj img:nth-child(4) {
            object-position: center center;
        }

        /* Telefon: 2 sütun x 3 satır (dikey fotoğraflara uygun) */
        @media (max-width: 768px), (orientation: portrait) {
            .kolaj {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, 1fr);
            }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.35);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            width: min(90vw, 520px);
        }

        h1 {
            color: #ff477e;
            margin: 0 0 30px;
            font-size: 2.2rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 14px 36px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        #evet {
            background-color: #ff477e;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
        }

        #evet:hover {
            background-color: #ff2a66;
            transform: scale(1.05);
        }

        #hayir {
            background-color: #ccc;
            color: #333;
            z-index: 10;
        }

        #cevap {
            margin-top: 30px;
            font-size: 1.8rem;
            color: #ff477e;
            font-weight: bold;
            display: none;
        }

        @media (max-width: 480px) {
            .container { padding: 28px 18px; }
            h1 { font-size: 1.7rem; margin-bottom: 24px; }
            button { padding: 12px 28px; font-size: 1.05rem; }
            #cevap { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="kolaj">
        <img src="foto1.jpeg" alt="foto1">
        <img src="foto2.jpeg" alt="foto2">
        <img src="foto3.jpeg" alt="foto3">
        <img src="foto4.jpeg" alt="foto4">
        <img src="foto5.jpeg" alt="foto5">
        <img src="foto6.jpeg" alt="foto6">
    </div>

    <div class="container">
        <h1>Beni Seviyor musun?</h1>
        <div class="buttons">
            <button id="evet" onclick="cevapEvet()">Evet</button>
            <button id="hayir">Hayır</button>
        </div>
        <div id="cevap">Bende seni çok seviyorum! ❤️</div>
    </div>

    <script>
        function cevapEvet() {
            document.getElementById('cevap').style.display = 'block';
        }

        var hayirBtn = document.getElementById('hayir');

        function hareketEt(e) {
            if (e) e.preventDefault();

            // backdrop-filter fixed'i container'a hapsettiği için body'ye taşıyoruz
            if (hayirBtn.parentNode !== document.body) {
                var r = hayirBtn.getBoundingClientRect();
                hayirBtn.style.position = 'fixed';
                hayirBtn.style.left = r.left + 'px';
                hayirBtn.style.top = r.top + 'px';
                document.body.appendChild(hayirBtn);
                hayirBtn.offsetWidth; // reflow, animasyon düzgün başlasın
            }

            var butonW = hayirBtn.offsetWidth;
            var butonH = hayirBtn.offsetHeight;

            var x = Math.random() * (window.innerWidth - butonW - 20);
            var y = Math.random() * (window.innerHeight - butonH - 20);

            x = Math.max(10, x);
            y = Math.max(10, y);

            hayirBtn.style.transition = 'left 0.3s ease, top 0.3s ease';
            hayirBtn.style.left = x + 'px';
            hayirBtn.style.top = y + 'px';
        }

        hayirBtn.addEventListener('mouseover', hareketEt);
        hayirBtn.addEventListener('touchstart', hareketEt, { passive: false });
        hayirBtn.addEventListener('click', hareketEt);
    </script>
</body>
</html>
