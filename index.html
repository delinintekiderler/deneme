<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Seni Çok Seviyorum</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffe6eb;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .kolaj {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 4px;
            background: #ffe6eb;
            z-index: -1;
        }

        .kolaj img {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        @media (max-width: 768px), (orientation: portrait) {
            .kolaj {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, 1fr);
            }
        }

        h1 {
            margin: 0;
            padding: 0 16px;
            text-align: center;
            color: #b3122a;
            font-size: 3rem;
            /* Beyaz far efekti. Siyah istersen #fff yerine #000 yaz. */
            text-shadow:
                0 0 4px #fff,
                0 0 8px #fff,
                0 0 14px #fff,
                0 0 22px rgba(255, 255, 255, 0.9),
                0 0 34px rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <div class="kolaj">
        <img src="foto1.jpeg" alt="foto1">
        <img src="foto2.jpeg" alt="foto2">
        <img src="foto3.jpeg" alt="foto3">
        <img src="foto4.jpeg" alt="foto4">
        <img src="foto5.jpeg" alt="foto5">
        <img src="foto6.jpeg" alt="foto6">
    </div>

    <h1>Seni Çok Seviyorum ❤️</h1>
</body>
</html>
